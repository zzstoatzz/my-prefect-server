# Single-node monitoring: retain dashboard/alert inputs, bound scrape cardinality.
alertmanager:
  enabled: false

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true

kubeApiServer:
  enabled: false

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeProxy:
  enabled: false

kubeEtcd:
  enabled: false

kubeDns:
  enabled: false

coreDns:
  enabled: false

kubelet:
  enabled: true
  serviceMonitor:
    cAdvisor: true
    cAdvisorInterval: 30s
    metricRelabelings:
      # k3s exposes control-plane collectors on the kubelet /metrics endpoint.
      # These are not inputs to our kubelet dashboards/rules (the apiserver
      # rules select job="apiserver", whose scrape is disabled above).
      - action: drop
        sourceLabels: [__name__]
        regex: "(apiserver|etcd)_.*"
      # Preserve the chart's storage histogram bucket reduction.
      - action: drop
        sourceLabels: [__name__, le]
        regex: '(csi_operations|storage_operation_duration)_seconds_bucket;(0.25|2.5|15|25|120|600)(\.0)?'

prometheus:
  prometheusSpec:
    scrapeInterval: 60s
    retention: 7d
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

    # heavypad, the home box. It is not in the cluster, so it cannot be found
    # by a ServiceMonitor — it is scraped directly over the tailnet, which the
    # cluster pods can route to. node_exporter there binds ONLY to the tailnet
    # address, so this path is never reachable from the public internet.
    additionalScrapeConfigs:
      - job_name: heavypad
        static_configs:
          - targets: ["100.96.216.23:9100"]
            labels:
              instance: heavypad
              role: home-box
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
    resources:
      requests:
        memory: 200Mi
      limits:
        memory: 512Mi

  prometheusOperator:
    resources:
      requests:
        memory: 64Mi
      limits:
        memory: 128Mi

grafana:
  enabled: true

  # Credentials come from the `grafana-admin` secret in this namespace.
  # Never inline a literal here. To rotate:
  #   kubectl create secret generic grafana-admin -n monitoring \
  #     --from-literal=admin-user=admin \
  #     --from-literal=admin-password="$(python3 -c 'import secrets;print(secrets.token_urlsafe(32))')" \
  #     --dry-run=client -o yaml | kubectl apply -f -
  #   then re-run the monitoring helm upgrade and restart the deployment.
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password

  # Ubuntu image required — DuckDB plugin uses glibc binaries, Alpine won't work
  image:
    repository: grafana/grafana
    tag: "latest-ubuntu@sha256:06d0bf32de77a7cf32eb8c705332c8f573fc07441d95f29f26f39e4deb98e48f"

  grafana.ini:
    auth.anonymous:
      enabled: true
      org_role: Viewer
    server:
      root_url: "https://GRAFANA_DOMAIN_PLACEHOLDER"
    plugins:
      allow_loading_unsigned_plugins: motherduck-duckdb-datasource

  # plugin not in Grafana registry — pre-installed on node via `just install-grafana-plugin`
  # grafana reads a snapshot copy of the DuckDB — never the live file.
  # a busybox sidecar refreshes the snapshot every 60s so the DuckDB plugin
  # can't take an exclusive lock on the production database.

  extraVolumeMounts:
    - name: duckdb-plugin
      mountPath: /var/lib/grafana/plugins/motherduck-duckdb-datasource
      readOnly: true
    - name: analytics-snapshot
      mountPath: /analytics
      readOnly: true

  extraInitContainers:
    # seed the snapshot before grafana starts so the datasource has data on first boot
    - name: snapshot-seed
      image: busybox:1
      command: ["sh", "-c"]
      args:
        - |
          src=/analytics-src/analytics.duckdb
          dst=/analytics-snap/analytics.duckdb
          until [ -f "$src" ]; do echo "waiting for $src"; sleep 5; done
          cp "$src" "$dst"
      volumeMounts:
        - name: analytics-duckdb
          mountPath: /analytics-src
          readOnly: true
        - name: analytics-snapshot
          mountPath: /analytics-snap

  # extraContainers is templated as a string in grafana chart 7.x (tpl . $)
  extraContainers: |
    - name: snapshot-sync
      image: busybox:1
      command: ["sh", "-c"]
      args:
        - |
          src=/analytics-src/analytics.duckdb
          dst=/analytics-snap/analytics.duckdb
          last_sig=
          while true; do
            if [ -f "$src" ]; then
              sig="$(stat -c '%s:%Y' "$src" 2>/dev/null || echo missing)"
              if [ "$sig" != "$last_sig" ]; then
                cp "$src" "$dst.tmp" && mv "$dst.tmp" "$dst"
                last_sig="$sig"
              fi
            fi
            sleep 60
          done
      volumeMounts:
        - name: analytics-duckdb
          mountPath: /analytics-src
          readOnly: true
        - name: analytics-snapshot
          mountPath: /analytics-snap
      resources:
        requests:
          memory: 16Mi
        limits:
          memory: 128Mi

  extraVolumes:
    - name: duckdb-plugin
      hostPath:
        path: /var/lib/grafana-plugins/motherduck-duckdb-datasource
        type: Directory
    - name: analytics-duckdb
      hostPath:
        path: /var/lib/prefect-analytics
        type: DirectoryOrCreate
    - name: analytics-snapshot
      emptyDir: {}

  additionalDataSources:
    - name: DuckDB
      uid: duckdb
      type: motherduck-duckdb-datasource
      access: proxy
      isDefault: false
      jsonData:
        path: /analytics/analytics.duckdb?access_mode=read_only

  # Provision directly from ConfigMaps instead of two persistent API watchers.
  # Keep the parent chart's datasource generator (Prometheus + DuckDB).
  forceDeployDatasources: true
  extraConfigmapMounts:
    - name: provisioned-datasources
      configMap: kube-prometheus-stack-grafana-datasource
      mountPath: /etc/grafana/provisioning/datasources
      readOnly: true

  sidecar:
    dashboards:
      enabled: false
    datasources:
      enabled: false
      alertmanager:
        enabled: false

  serviceMonitor:
    metricRelabelings:
      # Keep every metric referenced by Grafana Overview plus runtime health.
      - action: keep
        sourceLabels: [__name__]
        regex: 'grafana_(build_info|stat_totals_dashboard|alerting_result_total|http_request_duration_seconds_.*)|process_.*|go_.*'

  dashboardProviders:
    dashboards.yaml:
      apiVersion: 1
      providers:
        - name: provisioned
          orgId: 1
          folder: ""
          type: file
          disableDeletion: false
          editable: false
          updateIntervalSeconds: 30
          options:
            path: /var/lib/grafana/dashboards

  # Chart 87.18.1 dashboard ConfigMaps, mounted as directories so kubelet
  # propagates updates. Personal dashboards share one map, built by just dashboards.
  dashboardsConfigMaps:
    prefect: prefect-dashboards
    cluster-total: kube-prometheus-stack-cluster-total
    grafana-overview: kube-prometheus-stack-grafana-overview
    k8s-resources-cluster: kube-prometheus-stack-k8s-resources-cluster
    k8s-resources-multicluster: kube-prometheus-stack-k8s-resources-multicluster
    k8s-resources-namespace: kube-prometheus-stack-k8s-resources-namespace
    k8s-resources-node: kube-prometheus-stack-k8s-resources-node
    k8s-resources-nodes-overview: kube-prometheus-stack-k8s-resources-nodes-overview
    k8s-resources-pod: kube-prometheus-stack-k8s-resources-pod
    k8s-resources-workload: kube-prometheus-stack-k8s-resources-workload
    k8s-resources-workloads-namespace: kube-prometheus-stack-k8s-resources-workloads-namespace
    kubelet: kube-prometheus-stack-kubelet
    namespace-by-pod: kube-prometheus-stack-namespace-by-pod
    namespace-by-workload: kube-prometheus-stack-namespace-by-workload
    node-cluster-rsrc-use: kube-prometheus-stack-node-cluster-rsrc-use
    node-rsrc-use: kube-prometheus-stack-node-rsrc-use
    nodes: kube-prometheus-stack-nodes
    nodes-aix: kube-prometheus-stack-nodes-aix
    nodes-darwin: kube-prometheus-stack-nodes-darwin
    persistentvolumesusage: kube-prometheus-stack-persistentvolumesusage
    pod-total: kube-prometheus-stack-pod-total
    prometheus: kube-prometheus-stack-prometheus
    workload-total: kube-prometheus-stack-workload-total

  resources:
    requests:
      memory: 192Mi
    limits:
      memory: 384Mi
