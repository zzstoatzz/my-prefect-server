# Standalone automations — the ones prefect.yaml cannot express.
#
# Deployment `triggers:` sugar in prefect.yaml only produces automations whose
# action is run-deployment on that deployment. Anything else (send-notification,
# or a trigger that fans into a different deployment) has to be created against
# the API, which is why `flow-run failure -> discord` lived only as a database
# row for months. Applied by `just automations`.
#
# Names are the identity: applying updates the automation with a matching name
# rather than creating a second one. Automations created by `prefect deploy`
# (the `*__automation_1` ones) are left alone.
#
# Both send-notification automations were disabled 2026-07-27 because the zig
# server hung on every *successful* discord delivery: discord answers a webhook
# POST with 204 No Content, and a body-less 2xx never returned from the http
# client, so the action held an actions_executor slot forever. Two of those
# stopped every automation action on the server. Fixed in prefect-server
# d5fc1f2 (`?wait=true` asks discord for a body); re-enabled and verified —
# the .executed audit event lands and run-deployment actions keep working after
# repeated notifications. See prefect-server
# docs/incidents/2026-07-27-send-notification-hang-on-204.md.

automations:
  - name: flow-run failure -> discord
    description: >-
      Any deployment failing, crashing, or timing out. This is the operational
      floor — it fires on flow runs, not on repository activity.
    enabled: true
    trigger:
      type: event
      posture: Reactive
      expect:
        - prefect.flow-run.Failed
        - prefect.flow-run.Crashed
        - prefect.flow-run.TimedOut
      threshold: 1
      within: 60
    actions:
      - type: send-notification
        block_document_id: f9c9d7b1-3419-4056-84b0-5565f71fa944
        subject: "{{ deployment.name }} {{ state.name }}"
        body: "{{ deployment.name }} run {{ flow_run.name }} reached {{ state.name }} - {{ state.message }}"

  - name: fastmcp activity -> brief
    description: >-
      Fires when fastmcp gets busy, not when a single notification arrives.
      threshold/within is the whole point: 8 thread updates inside an hour means
      something is happening. The brief flow then reads the entire window back
      off the bus, so it sees the situation rather than the one event that
      tripped the trigger.
    enabled: true
    trigger:
      type: event
      posture: Reactive
      expect:
        - github.*
      match:
        githubrepo: PrefectHQ/fastmcp
      threshold: 8
      within: 3600
    actions:
      - type: run-deployment
        source: selected
        deployment: fastmcp-brief
        parameters:
          window_hours: 6

  - name: fastmcp direct ask -> brief
    description: >-
      Someone is actually blocked on you (review requested, mention, assignment).
      No threshold — one is enough.
    enabled: true
    trigger:
      type: event
      posture: Reactive
      expect:
        - github.review_requested
        - github.mention
        - github.team_mention
        - github.assign
      match:
        githubrepo: PrefectHQ/fastmcp
      threshold: 1
      within: 60
    actions:
      - type: run-deployment
        source: selected
        deployment: fastmcp-brief
        parameters:
          window_hours: 2

  - name: brief ready -> discord
    description: >-
      The only automation that sends fastmcp activity to a human, and it sends
      LLM-composed text rather than a rendered notification. Keeping delivery
      here means fastmcp_brief.py needs no webhook credentials.
    enabled: true
    trigger:
      type: event
      posture: Reactive
      expect:
        - hub.brief.ready
      threshold: 1
      within: 60
    actions:
      - type: send-notification
        block_document_id: f9c9d7b1-3419-4056-84b0-5565f71fa944
        subject: "{{ resource.name }}"
        body: "{{ payload.brief }}"

  - name: flow-run failure -> autofix
    description: >-
      Same trigger as the discord alert, but it starts the autofix deployment
      with the failed run's id. pi diagnoses every failure read-only; for the
      deployments in propose_for (the canaries) it also opens a gardener pull
      with a fix. threshold/within collapses a burst of failures into one run.
      autofix itself never reaches Failed, so it cannot re-trigger this.
    enabled: true
    trigger:
      type: event
      posture: Reactive
      expect:
        - prefect.flow-run.Failed
        - prefect.flow-run.Crashed
        - prefect.flow-run.TimedOut
      threshold: 1
      within: 600
    actions:
      - type: run-deployment
        source: selected
        deployment: autofix
        parameters:
          flow_run_id: "{{ flow_run.id }}"
          propose_for:
            - strata-hourly
            - mcp-atlas

  - name: autofix proposed -> phi review
    description: >-
      Every gardener pull gets phi's review before the operator looks. She
      reads the whole change and comments a VERDICT line on the pull; the
      operator still merges. Stage one of handing review off to her.
    enabled: true
    trigger:
      type: event
      posture: Reactive
      expect:
        - autofix.proposed
      threshold: 1
      within: 60
    actions:
      - type: run-deployment
        source: selected
        deployment: phi-pull-review
        parameters:
          material: "{{ payload.pull }}\ntitle: {{ payload.title }}\nopened by gardener (autofix) for a failed {{ payload.deployment }} run\n{{ payload.pr_url }}"

  - name: autofix diagnosed -> discord
    description: >-
      One line: pi's read-only verdict on a failed run, linking the failed run
      and the autofix run whose logs hold the full diagnosis. autofix.py holds
      no webhook credential.
    enabled: true
    trigger:
      type: event
      posture: Reactive
      expect:
        - autofix.diagnosed
      threshold: 1
      within: 60
    actions:
      - type: send-notification
        block_document_id: f9c9d7b1-3419-4056-84b0-5565f71fa944
        subject: "autofix: {{ resource.name }}"
        body: "{{ payload.summary }}\nfailed run: {{ payload.failed_run_url }}\nfull diagnosis: {{ payload.autofix_url }}"

  - name: autofix proposed -> discord
    description: >-
      autofix opened a gardener-authored pull for a failed run. One line plus
      the pulls page; review happens on tangled, not in chat.
    enabled: true
    trigger:
      type: event
      posture: Reactive
      expect:
        - autofix.proposed
      threshold: 1
      within: 60
    actions:
      - type: send-notification
        block_document_id: f9c9d7b1-3419-4056-84b0-5565f71fa944
        subject: "autofix PR: {{ resource.name }}"
        body: "{{ payload.title }}\n{{ payload.pr_url }}\nfull diagnosis: {{ payload.autofix_url }}"

  - name: sustained burn -> discord
    description: >-
      diagnostics found a process (outside the prefect workload) that has held
      a core for hours on the host. Repeats hourly with the canary until the
      process is dealt with — that persistence is the point.
    enabled: true
    trigger:
      type: event
      posture: Reactive
      expect:
        - diagnostics.sustained-burn
      threshold: 1
      within: 60
    actions:
      - type: send-notification
        block_document_id: f9c9d7b1-3419-4056-84b0-5565f71fa944
        subject: "sustained cpu burn on {{ resource.name }}"
        body: "{{ payload.burners }}"

  - name: autofix revised -> discord
    description: >-
      gardener answered a review comment — reply text plus whether a new
      round landed. the conversation itself lives on the pull.
    enabled: true
    trigger:
      type: event
      posture: Reactive
      expect:
        - autofix.revised
      threshold: 1
      within: 60
    actions:
      - type: send-notification
        block_document_id: f9c9d7b1-3419-4056-84b0-5565f71fa944
        subject: "autofix revise: {{ resource.name }}"
        body: "{{ payload.reply }}"
