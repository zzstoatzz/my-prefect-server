# scrape the zig prefect server's metrics into the monitoring stack.
#
# two processes write flow run states and each counts what it wrote, so
# both are scraped and prometheus adds them up: the webserver's /api/metrics,
# behind the same basic auth as the rest of /api (the pair in
# prefect-metrics-auth, derived from AUTH_STRING by `just metrics`), and the
# services pod's metrics port, which has no auth and is only reachable inside
# the cluster. a PodMonitor rather than a ServiceMonitor because the services
# pod sits behind no Service. the monitoring values set
# podMonitorSelectorNilUsesHelmValues=false, so no release label is needed.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: prefect-server
  namespace: prefect
  labels:
    app.kubernetes.io/name: prefect-server
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: prefect-server
  namespaceSelector:
    matchNames: [prefect]
  podMetricsEndpoints:
    - port: http
      path: /api/metrics
      interval: 30s
      basicAuth:
        username:
          name: prefect-metrics-auth
          key: username
        password:
          name: prefect-metrics-auth
          key: password
    - port: metrics
      path: /metrics
      interval: 30s
