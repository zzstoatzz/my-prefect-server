apiVersion: apps/v1
kind: Deployment
metadata:
  name: hub
  namespace: prefect
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hub
  template:
    metadata:
      labels:
        app: hub
    spec:
      imagePullSecrets:
        - name: atcr-creds
      containers:
        - name: hub
          image: atcr.io/zzstoatzz.io/hub:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: DUCKDB_PATH
              value: /analytics/analytics.duckdb
          volumeMounts:
            - name: analytics
              mountPath: /analytics
              readOnly: true
          resources:
            requests:
              # raised from 64Mi: steady-state sits ~190Mi after duckdb mmaps the
              # analytics db, so 64Mi was a misleading scheduler reservation.
              memory: 192Mi
              cpu: 50m
            limits:
              # raised from 256Mi: OOMKilled 96× in 16h on traffic spikes — duckdb
              # queries against the analytics db push transiently past the cap.
              memory: 768Mi
              cpu: 500m
      volumes:
        - name: analytics
          hostPath:
            path: /var/lib/prefect-analytics
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: hub
  namespace: prefect
spec:
  selector:
    app: hub
  ports:
    - port: 3000
      targetPort: 3000
