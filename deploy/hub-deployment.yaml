apiVersion: apps/v1
kind: Deployment
metadata:
  name: hub
  namespace: prefect
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hub
  template:
    metadata:
      labels:
        app: hub
    spec:
      imagePullSecrets:
        - name: atcr-creds
      containers:
        - name: hub
          image: atcr.io/zzstoatzz.io/hub:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: DUCKDB_PATH
              # slim hub-only db built by flows/transform.py:export_hub_db.
              # the full analytics.duckdb (~1 GB, mostly raw_phi_observations
              # which hub never queries) sits next to it on the same hostPath
              # for dbt + grafana to keep using.
              value: /analytics/hub.duckdb
          volumeMounts:
            - name: analytics
              mountPath: /analytics
              readOnly: true
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              # back down from 1536Mi now that hub mmaps hub.duckdb (~50–100Mi)
              # instead of analytics.duckdb (~1 GB, mostly raw_phi_observations
              # that hub never queries). leaves ~3x headroom over the file size
              # for node runtime + query plans.
              memory: 384Mi
              cpu: 500m
      volumes:
        - name: analytics
          hostPath:
            path: /var/lib/prefect-analytics
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: hub
  namespace: prefect
spec:
  selector:
    app: hub
  ports:
    - port: 3000
      targetPort: 3000
