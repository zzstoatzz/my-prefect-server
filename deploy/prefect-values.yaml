global:
  prefect:
    image:
      # 3.7.0 ships the V2 UI bundle with show_promotional_content
      # gating wired up (added in 3.6.26 + 3.6.28). 3.6.23 didn't.
      prefectTag: 3.7.0-python3.11

server:
  replicaCount: 1

  basicAuth:
    enabled: true
    existingSecret: prefect-auth

  uiConfig:
    prefectUiApiUrl: "https://DOMAIN_PLACEHOLDER/api"

  env:
    - name: PREFECT_SERVER_UI_SHOW_PROMOTIONAL_CONTENT
      value: "false"
    - name: PREFECT_SERVER_UI_V2_ENABLED
      value: "true"
    # also set on the API pod so /api/admin/settings reflects the active
    # vacuum config. the vacuum service itself only runs in the
    # backgroundServices pod (see below) but keeping these aligned avoids
    # confusion when querying the running config.
    - name: PREFECT_SERVER_SERVICES_DB_VACUUM_ENABLED
      value: "events,flow_runs"
    - name: PREFECT_SERVER_SERVICES_DB_VACUUM_RETENTION_PERIOD
      value: "1209600"  # 14d for flow_runs; events use PREFECT_EVENTS_RETENTION_PERIOD (default 7d)

  extraEnvVarsCM: prefect-docket-config

backgroundServices:
  runAsSeparateDeployment: true
  replicaCount: 1
  env:
    # vacuum service runs HERE (background services pod). retires the
    # custom flows/cleanup.py weekly deployment in favor of the built-in
    # vacuum which also handles orphaned logs / artifacts / stale
    # artifact collections, and uses end_time rather than start_time so
    # crashed-before-running flows get cleaned up too.
    - name: PREFECT_SERVER_SERVICES_DB_VACUUM_ENABLED
      value: "events,flow_runs"
    - name: PREFECT_SERVER_SERVICES_DB_VACUUM_RETENTION_PERIOD
      value: "1209600"  # 14d
  extraEnvVarsCM: prefect-docket-config

postgresql:
  enabled: true
  auth:
    enablePostgresUser: false
    database: prefect
    username: prefect
  primary:
    persistence:
      enabled: true
      size: 10Gi

redis:
  enabled: true
  architecture: standalone

ingress:
  enabled: true
  className: traefik
  host:
    hostname: DOMAIN_PLACEHOLDER
    path: /
    pathType: Prefix
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Workaround for PrefectHQ/prefect#21912 — see deploy/v2-trailing-slash.yaml.
    # Remove this annotation once a fixed prefect release is pinned above.
    traefik.ingress.kubernetes.io/router.middlewares: prefect-v2-trailing-slash@kubernetescrd
  tls: true
