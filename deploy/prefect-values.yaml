# Values for the zig prefect-server chart at
# tangled.org/zzstoatzz.io/prefect-server/charts/prefect-server.
#
# Topology matches what we ran on the python chart: postgres + redis,
# basic auth, ingress at DOMAIN_PLACEHOLDER. Differences from the python
# values that lived here before:
#
#   - no `postgresql:` / `redis:` subchart blocks — zig chart is BYO,
#     so postgres + redis live in deploy/prefect-postgres.yaml +
#     deploy/prefect-redis.yaml as standalone manifests
#   - the server image carries only the Prefect React v2 UI bundle, served at
#     `/` as the only UI. The old UI is not bundled.
#   - no `v2-trailing-slash` middleware annotation — that was a
#     workaround for PrefectHQ/prefect#21912 in the python UI bundle
#   - no `extraEnvVarsCM: prefect-docket-config` — the zig server has
#     docket built in; no env-var bridge needed
#
# Operator action before `just deploy`:
#   - PREFECT_SERVER_CHART_PATH must point at a checkout of the
#     prefect-server repo (defaults to ../prefect-server in justfile)

image:
  repository: atcr.io/zzstoatzz.io/prefect-server
  tag: "8733e31944059a95afdd90a98020be57fe9b794e"
  pullPolicy: IfNotPresent
  pullSecrets:
    - atcr-creds

config:
  server:
    apiHost: "0.0.0.0"
    port: 4200
    loggingLevel: "INFO"
  ui:
    # served from the ui-bundle init container below, not the /app/ui bundle
    # baked into the server image. drop the init container and set this back
    # to /app/ui to return to the stock UI.
    staticDir: /ui-bundle
    serveBase: /
  database:
    backend: postgres
    existingSecret: prefect-db-url
    existingSecretKey: url
  broker:
    backend: redis
    redis:
      host: prefect-redis
      port: 6379
      db: 0

# vacuum knobs preserved from the python values. names + shape now match
# python prefect itself (we aligned them in the zig server recently).
extraEnv:
  - name: PREFECT_SERVER_SERVICES_DB_VACUUM_ENABLED
    value: "events,flow_runs"
  - name: PREFECT_SERVER_SERVICES_DB_VACUUM_RETENTION_PERIOD
    value: "1209600"   # 14d for flow_runs; events use PREFECT_SERVER_EVENTS_RETENTION_PERIOD default 7d
  - name: PREFECT_SERVER_UI_SHOW_PROMOTIONAL_CONTENT
    value: "false"
  - name: LOGFIRE_TOKEN
    valueFrom:
      secretKeyRef:
        name: logfire
        key: token

auth:
  enabled: true
  existingSecret: prefect-auth
  # second credential that may only read (GET, the POST query endpoints,
  # events-out/logs-out sockets). phi's prefect MCP holds this one, not the
  # admin string. prefect-server 3e369f7+.
  readOnlyExistingSecret: prefect-auth-ro

webserver:
  enabled: true
  replicas: 2
  resources:
    requests: { cpu: 100m, memory: 64Mi }
    limits:   { cpu: 1,    memory: 256Mi }
  # Prefect UI bundle built by prefect-server's publish-ui-image workflow from
  # the commit pinned in its docker/ui.env (the ui-v2-mobile fork branch).
  extraInitContainers:
    - name: ui-bundle
      image: atcr.io/zzstoatzz.io/prefect-ui:3c108a1ab2719197e4ec3381fbc3d830c3eacf40
      imagePullPolicy: IfNotPresent
      command: ["cp", "-R", "/ui/.", "/ui-bundle/"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits:   { cpu: 200m, memory: 64Mi }
      volumeMounts:
        - name: ui-bundle
          mountPath: /ui-bundle

extraVolumes:
  - name: ui-bundle
    emptyDir: {}
extraVolumeMounts:
  - name: ui-bundle
    mountPath: /ui-bundle
    readOnly: true

services:
  enabled: true
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 64Mi }
    limits:   { cpu: 500m, memory: 256Mi }

service:
  type: ClusterIP
  port: 4200
  annotations:
    traefik.ingress.kubernetes.io/service.serverstransport: prefect-prefect-server-short-idle@kubernetescrd

ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns01
  hosts:
    - host: DOMAIN_PLACEHOLDER
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: prefect-server.waow.tech-tls
      hosts: [DOMAIN_PLACEHOLDER]
