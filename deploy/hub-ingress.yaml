apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hub
  namespace: prefect
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - HUB_DOMAIN_PLACEHOLDER
      secretName: hub-tls
  rules:
    - host: HUB_DOMAIN_PLACEHOLDER
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              # hub-remote -> heavypad over the tailnet (see hub-remote.yaml).
              # was `hub` (the in-cluster pod, now retired — read stale data).
              service:
                name: hub-remote
                port:
                  number: 3000
