name: fastmcp-agentic-validation
build: []
push: []
pull:
  - prefect.deployments.steps.git_clone:
      repository: https://github.com/zzstoatzz/my-prefect-server.git
      commit_sha: "{{ $MPS_AGENTIC_REF }}"
deployments:
  - name: cloud-validation
    entrypoint: flows/agentic_validate_patch.py:validate_patch
    schedules: []
    concurrency_limit: 1
    parameters: {}
    work_pool:
      name: managed
      job_variables:
        image: prefecthq/prefect:3-python3.12
        compute_profile: medium
        timeout: 2700
