# Existing volatile installs must use the migration procedure before applying.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prefect-redis-data
  namespace: prefect
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prefect-redis-durable
  namespace: prefect
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: prefect-redis-durable }
  template:
    metadata:
      labels: { app: prefect-redis-durable }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args:
            - redis-server
            - --appendonly
            - "yes"
            - --appendfsync
            - always
            - --save
            - ""
            - --maxmemory
            - 192mb
            - --maxmemory-policy
            - noeviction
          ports: [{ containerPort: 6379 }]
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec: { command: [redis-cli, ping] }
            initialDelaySeconds: 1
            periodSeconds: 2
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 500m, memory: 512Mi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: prefect-redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: prefect-redis
  namespace: prefect
spec:
  selector: { app: prefect-redis-durable }
  ports: [{ port: 6379, targetPort: 6379 }]
