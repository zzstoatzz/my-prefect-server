worker_processes 1;
events { worker_connections 1024; }
http {
    map $http_authorization $backend_authorization {
        default $http_authorization;
        "Basic @OLD_AUTH@" "Basic @HOME_AUTH@";
    }
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    server {
        listen 127.0.0.1:13002;
        server_name prefect-server.waow.tech;
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header Authorization $backend_authorization;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        location /push { proxy_pass http://127.0.0.1:13001; }
        location = /api/presence { proxy_pass http://127.0.0.1:13000; }
        location / { proxy_pass http://127.0.0.1:14200; }
    }
}
