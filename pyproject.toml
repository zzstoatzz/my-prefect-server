[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "my-prefect-server"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "mps",
    "dbt-duckdb>=1.9",
    # dbt-core 1.11.8+ tightened the ModelLanguage enum to reject 'javascript'
    # in macro `language=` defaults, which dbt-duckdb 1.10.1 still ships
    # (for its JS-UDF macros). compile blows up with KeyError: 'javascript'
    # before any model parsing happens. pin to last known-good until
    # dbt-duckdb catches up or dbt-core relaxes the check.
    "dbt-core<1.11.8",
    "prefect-dbt>=0.6",
]

[project.optional-dependencies]
# phi-atlas flow only. installed at deploy time via `--with 'my-prefect-server[atlas] @ git+...'`
# so other flows' pods don't pull ~250MB of ML libs they never use.
atlas = [
    "numpy>=1.26",
    "scipy>=1.11",
    "umap-learn>=0.5",
    "hdbscan>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["packages/mps/src/mps"]

[tool.uv.sources]
mps = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "ty>=0.0.23",
]

[tool.ty.src]
include = ["flows", "packages/mps/src"]
exclude = ["**/__pycache__", ".venv", ".git"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.terminal]
error-on-warning = true
