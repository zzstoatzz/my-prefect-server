[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "my-prefect-server"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "mps",
    "dbt-duckdb>=1.9",
    # dbt-adapters 1.24.0 started enforcing supported_languages strictness
    # against dbt-core's ModelLanguage enum (sql/python only). dbt-core's
    # own function.sql materialization in global_project declares
    # supported_languages=['sql','python','javascript'], so every parse
    # now blows up with KeyError: 'javascript' before any model resolution.
    # bisected: dbt-adapters 1.22.9 OK, 1.24.0 broken. last good transform
    # run (dancing-porpoise 2026-05-13 20:01 UTC) was on adapters 1.22.x;
    # 1.24.0 released 2026-05-13 ~21:00 UTC. pin until upstream fixes
    # dbt-core/global_project/.../function.sql to drop 'javascript' or
    # adds 'javascript' to ModelLanguage.
    "dbt-adapters<1.24",
    "prefect-dbt>=0.6",
]

[project.optional-dependencies]
# phi-atlas flow only. installed at deploy time via `--with 'my-prefect-server[atlas] @ git+...'`
# so other flows' pods don't pull ~250MB of ML libs they never use.
atlas = [
    "numpy>=1.26",
    "scipy>=1.11",
    "umap-learn>=0.5",
    "hdbscan>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["packages/mps/src/mps"]

[tool.uv.sources]
mps = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "ty>=0.0.23",
    "pytest>=8",
]

[tool.ty.src]
include = ["flows", "packages/mps/src"]
exclude = ["**/__pycache__", ".venv", ".git"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.terminal]
error-on-warning = true
