[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "my-prefect-server"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "mps",
    "dbt-duckdb>=1.9",
    # dbt-adapters 1.24.0 started enforcing supported_languages strictness
    # against dbt-core's ModelLanguage enum (sql/python only). dbt-core's
    # own function.sql materialization in global_project declares
    # supported_languages=['sql','python','javascript'], so every parse
    # now blows up with KeyError: 'javascript' before any model resolution.
    # bisected: dbt-adapters 1.22.9 OK, 1.24.0 broken. last good transform
    # run (dancing-porpoise 2026-05-13 20:01 UTC) was on adapters 1.22.x;
    # 1.24.0 released 2026-05-13 ~21:00 UTC. pin until upstream fixes
    # dbt-core/global_project/.../function.sql to drop 'javascript' or
    # adds 'javascript' to ModelLanguage.
    "dbt-adapters<1.24",
    "prefect-dbt>=0.6",
    "prefect>=3.7.7",
    "logfire>=4.36.0",
    "semble-api>=0.0.2",
    "zstandard>=0.25.0",
    "websockets>=15.0.1",
]

[project.optional-dependencies]
# phi-atlas flow only. installed at deploy time via `--with 'my-prefect-server[atlas] @ git+...'`
# so other flows' pods don't pull ~250MB of ML libs they never use.
atlas = [
    "numpy>=1.26",
    "scipy>=1.11",
    "umap-learn>=0.5",
    "hdbscan>=0.8",
    # without a floor, uv satisfies numba's numpy<2.5 cap by backtracking
    # numba to 0.53 (py<3.10 only) instead of downgrading numpy — the
    # resulting sdist build crashed phi-atlas daily from 2026-06-22.
    "numba>=0.60",
]

[project.entry-points."prefect.plugins"]
mps-secrets = "mps.secrets_plugin"

[tool.hatch.build.targets.wheel]
packages = ["packages/mps/src/mps"]

[tool.uv.sources]
mps = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "ty>=0.0.23",
    "pytest>=8",
    # phi_atlas imports numpy at module scope and hdbscan/sklearn inside its
    # clustering task; without these `pytest tests/` cannot even collect
    # tests/test_phi_atlas_classifier.py. Tests must not fail — so the deps
    # its tests need belong in the dev group, not in a skip guard.
    "numpy>=1.26",
    "hdbscan>=0.8.40",
    "scikit-learn>=1.5",
    # async tests (e.g. tests/test_bisk_retries.py) need a runner; with
    # asyncio_mode = "auto" below, no test needs an @pytest.mark.asyncio.
    "pytest-asyncio>=0.24",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ty.src]
include = ["flows", "packages/mps/src"]
exclude = ["**/__pycache__", ".venv", ".git"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.terminal]
error-on-warning = true

[tool.ruff]
line-length = 100
extend-exclude = ["analytics", "web", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF", "PLW1510"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
combine-as-imports = true
