name: prefect-cloud-recovery

pull:
  - prefect.deployments.steps.git_clone:
      repository: https://github.com/zzstoatzz/my-prefect-server.git
      commit_sha: "{{ $MPS_SHA }}"

deployments:
  - name: bufo-traffic-recovery
    entrypoint: flows/bufo_traffic.py:bufo_traffic
    description: Manual-only recovery; defaults to read-only Logfire rollup.
    tags: [recovery, manual-only]
    work_pool:
      name: managed
      job_variables:
        image: prefecthq/prefect:3-latest
        pip_packages:
          - prefect==3.8.2
          - "mps @ git+https://github.com/zzstoatzz/my-prefect-server.git@{{ $MPS_SHA }}#subdirectory=packages/mps"
    parameters:
      config:
        dry_run: true
        days_back: 2
    concurrency_limit:
      limit: 1
      collision_strategy: CANCEL_NEW
    schedules: []

  - name: diagnostics-recovery
    entrypoint: flows/diagnostics.py:diagnostics
    description: >-
      Manual portability rehearsal. Measures its managed runtime, not HeavyPad.
      No home mounts, credentials, schedules or notification automations.
    tags: [recovery, manual-only]
    work_pool:
      name: managed
      job_variables:
        image: prefecthq/prefect:3-python3.12
        pip_packages: [prefect==3.8.2]
    parameters:
      scan_cache_size: false
    schedules: []
