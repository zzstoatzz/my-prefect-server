name: prefect-cloud-recovery

pull:
  - prefect.deployments.steps.git_clone:
      repository: https://github.com/zzstoatzz/my-prefect-server.git
      commit_sha: "{{ $MPS_SHA }}"

deployments:
  - name: mcp-fleet-health-recovery
    entrypoint: flows/mcp_fleet_health.py:mcp_fleet_health
    description: Manual public MCP protocol/discovery checks; findings are artifacts, without Cloud notification automations.
    tags: [recovery, manual-only]
    work_pool:
      name: managed
      job_variables:
        image: prefecthq/prefect:3-python3.12
        pip_packages:
          - prefect==3.8.2
          - fastmcp==4.1.3
          - fastmcp-slim==4.1.3
    concurrency_limit:
      limit: 1
      collision_strategy: CANCEL_NEW
    schedules: []
  - name: bufo-traffic-recovery
    entrypoint: flows/bufo_traffic.py:bufo_traffic
    description: Manual-only recovery; defaults to read-only Logfire rollup.
    tags: [recovery, manual-only]
    pull:
      - prefect.deployments.steps.set_working_directory:
          directory: /tmp
      - prefect.deployments.steps.git_clone:
          repository: https://github.com/zzstoatzz/my-prefect-server.git
          commit_sha: "{{ $MPS_SHA }}"
          clone_directory_name: recovery-source
      - prefect.deployments.steps.set_working_directory:
          directory: /tmp/recovery-source
    work_pool:
      name: managed
      job_variables:
        image: prefecthq/prefect:3-python3.12
        env:
          PYTHONPATH: /tmp/recovery-source/packages/mps/src
        pip_packages:
          - prefect==3.8.2
          - httpx==0.28.1
          - pydantic==2.13.4
          - atproto==0.0.67
          - pdsx==0.0.1a23
    parameters:
      config:
        dry_run: true
        days_back: 2
    concurrency_limit:
      limit: 1
      collision_strategy: CANCEL_NEW
    schedules: []

  - name: diagnostics-recovery
    entrypoint: flows/diagnostics.py:diagnostics
    description: >-
      Manual portability rehearsal. Measures its managed runtime, not HeavyPad.
      No home mounts, credentials, schedules or notification automations.
    tags: [recovery, manual-only]
    work_pool:
      name: managed
      job_variables:
        image: prefecthq/prefect:3-python3.12
        pip_packages: [prefect==3.8.2]
    parameters:
      scan_cache_size: false
    schedules: []
