when:
  - event: ["push"]
    branch: main

engine: microvm
image: nixos

dependencies:
  - uv
  - python314
  - bun
  - ruff
  - ty
  - stdenv.cc.cc.lib
  - git

environment:
  UV_PYTHON_PREFERENCE: "only-system"

steps:
  - name: check
    command: |
      set -euo pipefail
      ulimit -n 8192
      for lib in /nix/store/*-gcc-*-lib/lib; do export LD_LIBRARY_PATH="$lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"; done
      uv run scripts/validate_deployments.py --config prefect.heavypad.yaml
      uv sync --extra dagster --extra inbox
      ruff check .
      ruff format --check .
      ty check
      uv run --extra dagster --extra inbox pytest -q -x
      cd web
      bun install --frozen-lockfile
      bun run check
      bun run lint

