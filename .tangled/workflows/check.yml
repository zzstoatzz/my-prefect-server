when:
  - event: ["push"]
    branch: main

engine: microvm
image: nixos

dependencies:
  - uv
  - python314
  - bun
  - stdenv.cc.cc.lib
  - git

environment:
  UV_PYTHON_PREFERENCE: "only-system"

steps:
  - name: check
    command: |
      set -euo pipefail
      ulimit -n 8192
      for lib in /nix/store/*-gcc-*-lib/lib; do export LD_LIBRARY_PATH="$lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"; done
      uv run scripts/validate_deployments.py --config prefect.heavypad.yaml
      uv sync --locked --extra dagster --extra inbox
      uv run --no-sync ruff check .
      uv run --no-sync ruff format --check .
      uv run --no-sync ty check
      uv run --no-sync pytest -q -x -n 4 -m "not integration" --durations=10
      cd web
      bun install --frozen-lockfile
      bun run check
      bun run lint
      bun test
      cd ../deploy/heavypad-watchdog
      bun install --frozen-lockfile
      bun run check
      bun test

