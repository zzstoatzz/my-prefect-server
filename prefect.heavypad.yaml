  - name: mcp-atlas
    entrypoint: flows/mcp_atlas/crawl.py:mcp_atlas
    tags: [publish, heavypad]
    work_pool:
      name: heavypad-pool
      job_variables:
        command: >-
          uv run --no-project --with prefect==3.8.2
          --with 'mcp-atlas @ git+https://tangled.org/zzstoatzz.io/mcp-atlas.git@238d50fc7b97fd57129f787f1be2460f3c1a1614'
          prefect flow-run execute
        env:
