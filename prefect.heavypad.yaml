  - name: bisk-snapshot
    entrypoint: flows/bisk.py:bisk_snapshot
    tags: [publish, heavypad]
    work_pool:
      name: heavypad-pool
      job_variables:
        command: >-
          env PREFECT_PLUGINS_ENABLED=true PREFECT_PLUGINS_ALLOW=mps-secrets
          uv run --no-project --with prefect==3.8.2
          --with 'my-prefect-server @ git+https://github.com/zzstoatzz/my-prefect-server.git{{ $MPS_PIN }}'
          prefect flow-run execute
        env:
          MPS_PIN: "{{ $MPS_PIN }}"
          PREFECT_PLUGINS_ENABLED: "true"
          PREFECT_PLUGINS_ALLOW: mps-secrets
          PREFECT_LOCAL_STORAGE_PATH: /home/stoat/.local/share/prefect-home/results
          BISK_R2_ENDPOINT: prefect-block://bisk-r2-endpoint
          BISK_R2_ACCESS_KEY_ID: prefect-block://bisk-r2-access-key-id
          BISK_R2_SECRET_ACCESS_KEY: prefect-block://bisk-r2-secret-access-key
          BISK_R2_BUCKET: bisk
    concurrency_limit:
      limit: 1
      collision_strategy: CANCEL_NEW
    schedules:
      - cron: "*/10 * * * *"
        timezone: UTC
        active: true

  - name: costs
    entrypoint: flows/costs.py:costs
    tags: [watch, heavypad]
    work_pool:
      name: heavypad-pool
      job_variables:
        command: >-
          uv run --no-project
          --with 'mps @ git+https://github.com/zzstoatzz/my-prefect-server.git{{ $MPS_PIN }}#subdirectory=packages/mps'
          --with prefect==3.8.2 prefect flow-run execute
        env:
          MPS_PIN: "{{ $MPS_PIN }}"
          COSTS_PROVIDER_BLOCK_PREFIX: ''
          PREFECT_LOCAL_STORAGE_PATH: /home/stoat/.local/share/prefect-home/results
          CLOUDFLARE_ACCOUNT_ID: "3e9ba01cd687b3c4d29033908177072e"
          CLOUDFLARE_FIXED_COSTS_JSON: '{"plyr.fm":{"amount":1.00,"project":"plyr.fm","note":"plyr.fm domain registration"},"workers-paid-plan":{"amount":4.00,"project":"shared","note":"Cloudflare Workers Paid plan"}}'
    parameters:
      config:
        dry_run: false
    concurrency_limit:
      limit: 1
      collision_strategy: CANCEL_NEW
    schedules:
      - cron: "0 8 * * *"
        timezone: UTC

  - name: fleet-health
    entrypoint: flows/fleet_health.py:fleet_health
    tags: [watch, heavypad]
    work_pool:
      name: heavypad-pool
      job_variables:
        command: uv run --no-project --with prefect==3.8.2 prefect flow-run execute
        env:
          MPS_PIN: "{{ $MPS_PIN }}"
          PREFECT_UI_URL: https://heavypad.tailb660b6.ts.net:10443
          PREFECT_LOCAL_STORAGE_PATH: /home/stoat/.local/share/prefect-home/results
    concurrency_limit:
      limit: 1
      collision_strategy: CANCEL_NEW
    schedules:
      # offset from the top of the hour so it never samples stream during the
      # eval's :06/:36 windows or alongside the hourly ingest spin-up
      - cron: '3,18,33,48 * * * *'
        timezone: UTC
        active: true

  - name: mcp-fleet-health
    entrypoint: flows/mcp_fleet_health.py:mcp_fleet_health
    tags: [watch, heavypad]
    work_pool:
      name: heavypad-pool
