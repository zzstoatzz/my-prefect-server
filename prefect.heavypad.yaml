name: heavypad-prefect

pull:
  - prefect.deployments.steps.run_shell_script:
      stream_output: true
      script: |
        bash -c 'git clone --quiet https://github.com/zzstoatzz/my-prefect-server.git flow-source && git -C flow-source checkout --quiet "${MPS_PIN#@}"'
  - prefect.deployments.steps.set_working_directory:
      directory: flow-source

deployments:
  - name: costs
    entrypoint: flows/costs.py:costs
    tags: [watch, heavypad]
    work_pool:
      name: heavypad-pool
      job_variables:
        command: >-
          uv run --no-project
          --with 'mps @ git+https://github.com/zzstoatzz/my-prefect-server.git{{ $MPS_PIN }}#subdirectory=packages/mps'
          --with prefect==3.8.2 prefect flow-run execute
        env:
          MPS_PIN: "{{ $MPS_PIN }}"
          COSTS_PROVIDER_BLOCK_PREFIX: ''
          PREFECT_LOCAL_STORAGE_PATH: /home/stoat/.local/share/prefect-home/results
          CLOUDFLARE_ACCOUNT_ID: "3e9ba01cd687b3c4d29033908177072e"
          CLOUDFLARE_FIXED_COSTS_JSON: '{"plyr.fm":{"amount":1.00,"project":"plyr.fm","note":"plyr.fm domain registration"},"workers-paid-plan":{"amount":4.00,"project":"shared","note":"Cloudflare Workers Paid plan"}}'
    parameters:
      config:
        dry_run: false
    concurrency_limit:
      limit: 1
      collision_strategy: CANCEL_NEW
    schedules:
      - cron: "0 8 * * *"
        timezone: UTC

  - name: mcp-fleet-health
    entrypoint: flows/mcp_fleet_health.py:mcp_fleet_health
    tags: [watch, heavypad]
    work_pool:
      name: heavypad-pool
      job_variables:
        command: >-
          uv run --no-project --with prefect==3.8.2
          --with fastmcp==4.1.3 --with fastmcp-slim==4.1.3
          prefect flow-run execute
        env:
          MPS_PIN: "{{ $MPS_PIN }}"
          PREFECT_UI_URL: https://heavypad.tailb660b6.ts.net:10443
          PREFECT_LOCAL_STORAGE_PATH: /home/stoat/.local/share/prefect-home/results
    concurrency_limit:
      limit: 1
      collision_strategy: CANCEL_NEW
    schedules:
      - cron: '12 * * * *'
        timezone: UTC
        active: true

  - name: bufo-traffic
    entrypoint: flows/bufo_traffic.py:bufo_traffic
    tags: [watch, heavypad]
    work_pool:
      name: heavypad-pool
      job_variables:
        command: >-
          uv run --no-project
          --with 'mps @ git+https://github.com/zzstoatzz/my-prefect-server.git{{ $MPS_PIN }}#subdirectory=packages/mps'
          --with prefect==3.8.2 prefect flow-run execute
        env:
          MPS_PIN: "{{ $MPS_PIN }}"
          PREFECT_LOCAL_STORAGE_PATH: /home/stoat/.local/share/prefect-home/results
    parameters:
      config:
        dry_run: false
        days_back: 2
    concurrency_limit:
      limit: 1
      collision_strategy: CANCEL_NEW
    schedules:
      - cron: '7 * * * *'
        timezone: UTC
        active: true

  - name: diagnostics
    entrypoint: flows/diagnostics.py:diagnostics
    tags: [watch, heavypad]
    work_pool:
      name: heavypad-pool
      job_variables:
        command: uv run --no-project --with prefect==3.8.2 prefect flow-run execute
        env:
          MPS_PIN: "{{ $MPS_PIN }}"
          PREFECT_LOCAL_STORAGE_PATH: /home/stoat/.local/share/prefect-home/results
    parameters:
      scan_cache_size: false
    schedules:
      - cron: '37 * * * *'
        timezone: UTC
        active: true

  - name: canary
    entrypoint: flows/prefect_home_canary.py:prefect_home_canary
    tags: [heavypad]
    work_pool: &heavypad
      name: heavypad-pool
      job_variables:
        command: >-
          uv run --with 'my-prefect-server @ git+https://github.com/zzstoatzz/my-prefect-server.git{{ $MPS_PIN }}'
          --with prefect==3.8.2 prefect flow-run execute
        env:
          MPS_PIN: "{{ $MPS_PIN }}"
          PREFECT_LOCAL_STORAGE_PATH: /home/stoat/.local/share/prefect-home/results
    schedules: []

  - name: fastmcp-backlog
    entrypoint: flows/fastmcp_backlog.py:fastmcp_backlog
    tags: [watch, heavypad]
    work_pool:
      <<: *heavypad
      job_variables:
        command: >-
          uv run --with 'my-prefect-server @ git+https://github.com/zzstoatzz/my-prefect-server.git{{ $MPS_PIN }}'
          --with prefect==3.8.2 prefect flow-run execute
        env:
          MPS_PIN: "{{ $MPS_PIN }}"
          FASTMCP_BACKLOG_PATH: /home/stoat/prefect-analytics/fastmcp-backlog.jsonl
          PREFECT_LOCAL_STORAGE_PATH: /home/stoat/.local/share/prefect-home/results
    parameters:
      backfill_days: 0
    concurrency_limit:
      limit: 1
      collision_strategy: CANCEL_NEW
    schedules:
      - cron: '*/30 * * * *'
        timezone: UTC
        active: true

  - name: backup-freshness
    entrypoint: flows/backup_freshness.py:backup_freshness
    tags: [watch, heavypad]
    work_pool:
      name: heavypad-pool
      job_variables:
        command: uv run --no-project --with prefect==3.8.2 prefect flow-run execute
        env:
          MPS_PIN: "{{ $MPS_PIN }}"
          PREFECT_LOCAL_STORAGE_PATH: /home/stoat/.local/share/prefect-home/results
    concurrency_limit:
      limit: 1
      collision_strategy: CANCEL_NEW
    schedules:
      - cron: '5 7 * * *'
        timezone: UTC
        active: true
