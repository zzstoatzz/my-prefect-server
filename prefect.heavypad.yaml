    tags: [phi, heavypad]
    work_pool: *heavypad_phi
    parameters:
      slot: character-retro
    concurrency_limit:
      limit: 1
      collision_strategy: CANCEL_NEW
    schedules:
      - cron: "0 17 1 * *"
        timezone: UTC
        active: true

  - name: phi-chicken-scout
    entrypoint: flows/phi_trigger.py:phi_trigger
    tags: [phi, heavypad]
