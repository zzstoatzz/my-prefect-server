name: heavypad-prefect

pull:
  - prefect.deployments.steps.run_shell_script:
      stream_output: true
      script: |
        bash -c 'git clone --quiet https://github.com/zzstoatzz/my-prefect-server.git flow-source && git -C flow-source checkout --quiet "${MPS_PIN#@}"'
  - prefect.deployments.steps.set_working_directory:
      directory: flow-source

deployments:
  - name: watch-fastmcp
    entrypoint: flows/watch_fastmcp.py:watch_fastmcp
    tags: [watch, heavypad]
    work_pool: &heavypad_fastmcp
      name: heavypad-pool
      job_variables:
        command: >-
          uv run --no-project --with prefect==3.8.2
          --with 'mps @ git+https://github.com/zzstoatzz/my-prefect-server.git{{ $MPS_PIN }}#subdirectory=packages/mps'
          prefect flow-run execute
        env:
          MPS_PIN: "{{ $MPS_PIN }}"
          ANALYTICS_DB_PATH: /home/stoat/prefect-analytics/analytics.duckdb
          LLM_SPEND_LOG_PATH: /home/stoat/prefect-analytics/llm-spend.jsonl
          PREFECT_LOCAL_STORAGE_PATH: /home/stoat/prefect-analytics/storage
    concurrency_limit:
      limit: 1
      collision_strategy: CANCEL_NEW
    schedules:
      - cron: "*/5 * * * *"
        timezone: UTC
        active: false

  - name: fastmcp-brief
    entrypoint: flows/fastmcp_brief.py:fastmcp_brief
    tags: [watch, heavypad]
    work_pool: *heavypad_fastmcp
    concurrency_limit:
      limit: 1
      collision_strategy: CANCEL_NEW
    parameters:
      window_hours: 6
    schedules:
      - cron: "0 */4 * * *"
        timezone: UTC
        active: false

  - name: phi-curation
    entrypoint: flows/phi_trigger.py:phi_trigger
    tags: [phi, heavypad]
    work_pool: &heavypad_phi
      name: heavypad-pool
      job_variables:
        command: >-
          uv run --no-project --with prefect==3.8.2
          --with 'mps @ git+https://github.com/zzstoatzz/my-prefect-server.git{{ $MPS_PIN }}#subdirectory=packages/mps'
          prefect flow-run execute
        env:
          MPS_PIN: "{{ $MPS_PIN }}"
          PREFECT_LOCAL_STORAGE_PATH: /home/stoat/.local/share/prefect-home/results
    parameters:
      slot: curation
    concurrency_limit:
      limit: 1
      collision_strategy: CANCEL_NEW
    schedules:
      - cron: "0 3 * * 1"
        timezone: UTC
        active: true

  - name: phi-likes-review
    entrypoint: flows/phi_trigger.py:phi_trigger
    tags: [phi, heavypad]
    work_pool: *heavypad_phi
    parameters:
      slot: likes-review
    concurrency_limit:
      limit: 1
      collision_strategy: CANCEL_NEW
    schedules:
      - cron: "0 20 * * 0"
        timezone: UTC
        active: true

  - name: phi-editorial
    entrypoint: flows/phi_trigger.py:phi_trigger
    tags: [phi, heavypad]
