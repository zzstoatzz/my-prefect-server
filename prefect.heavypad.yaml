      job_variables:
        command: >-
          env PREFECT_LOCAL_STORAGE_PATH=/home/stoat/prefect-analytics/storage uv run --no-project --with prefect==3.8.2
          --with 'mps @ git+https://github.com/zzstoatzz/my-prefect-server.git{{ $MPS_PIN }}#subdirectory=packages/mps'
          prefect flow-run execute
        env:
          MPS_PIN: "{{ $MPS_PIN }}"
          ANALYTICS_DB_PATH: /home/stoat/prefect-analytics/analytics.duckdb
          LLM_SPEND_LOG_PATH: /home/stoat/prefect-analytics/llm-spend.jsonl
          PREFECT_LOCAL_STORAGE_PATH: /home/stoat/prefect-analytics/storage
    concurrency_limit:
