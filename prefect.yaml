name: my-prefect-server

# MPS_PIN pins the package install to an exact commit, as "@<sha>". CI sets it
# from the commit being deployed (.tangled/workflows/deploy.yml).
#
# It replaced a per-run `--refresh-package my-prefect-server`, which re-resolved
# and re-unpacked the wheel on EVERY flow run — 4,500+ entries and 50G in
# uv's archive-v0 on the home box. Pinning means one cache entry per deployed
# commit, reused by every run of it.
#
# It also closes a correctness gap: unpinned, flow runs resolved main at RUN
# time, so a push could change what already-scheduled runs executed with no
# deploy involved. Now a deploy is the only thing that moves the code.
#
# The '@' is inside the placeholder deliberately. Prefect renders an unset
# env-var placeholder to an empty string, so a bare '...git@{{ $MPS_SHA }}'
# would silently produce the malformed '...git@' and break every flow run.
# This way an unset MPS_PIN degrades to the plain unpinned URL instead.
# Deploying without it is still not what you want (uv may then serve a stale
# cached commit) — CI always sets it; set it by hand for a manual deploy.

pull:
  - prefect.deployments.steps.run_shell_script:
      script: |
        bash -c "rm -rf my-prefect-server && (git clone --depth 1 --branch main https://tangled.sh/zzstoatzz.io/my-prefect-server.git my-prefect-server || git clone --depth 1 --branch main https://github.com/zzstoatzz/my-prefect-server.git my-prefect-server)"
  - prefect.deployments.steps.set_working_directory:
      directory: my-prefect-server

definitions:
  work_pools:
    k8s: &k8s
      name: kubernetes-pool
      job_variables:
        command: >-
          uv run
          --with 'my-prefect-server @ git+https://github.com/zzstoatzz/my-prefect-server.git{{ $MPS_PIN }}'
          prefect flow-run execute
    # home box (heavypad) process pool. persistent analytics paths replace the
    # k8s PVC so DuckDB / spend-log / local-storage coordinate across flow runs
    # (process flow runs execute in an ephemeral /tmp dir, so these MUST be set).
    home: &home
      name: home-pool
      job_variables:
        command: >-
          uv run
          --with 'my-prefect-server @ git+https://github.com/zzstoatzz/my-prefect-server.git{{ $MPS_PIN }}'
          prefect flow-run execute
        env:
          ANALYTICS_DB_PATH: /home/stoat/prefect-analytics/analytics.duckdb
          LLM_SPEND_LOG_PATH: /home/stoat/prefect-analytics/llm-spend.jsonl
          PREFECT_LOCAL_STORAGE_PATH: /home/stoat/prefect-analytics/storage

deployments:
  - name: diagnostics
    entrypoint: flows/diagnostics.py:diagnostics
    # retargeted to the home box (heavypad) via the process work pool — canary
    # proving the home worker pulls code + executes flows. revert to *k8s anytime.
    work_pool:
      name: home-pool
      job_variables:
        command: >-
          uv run
          --with 'my-prefect-server @ git+https://github.com/zzstoatzz/my-prefect-server.git{{ $MPS_PIN }}'
          prefect flow-run execute
    schedules:
      - cron: "*/5 * * * *"
        active: false

  - name: ingest
    entrypoint: flows/ingest.py:ingest
    work_pool: *home
    # if a worker outage stacks a backlog, run one and CANCEL the rest instead of
    # grinding through dozens of stale runs. requires prefect-server >= b3e154a
    # (the Zig server now persists + enforces collision_strategy). reused below.
    concurrency_limit: &cancel_new
      limit: 1
      collision_strategy: CANCEL_NEW
    schedules:
      - cron: "0 * * * *"  # hourly
    parameters:
      only_unread: true

  # LLM email categorization, split from ingest so a classifier outage can't
  # fail ingestion. sits between ingest and transform so the dbt build always
  # joins fresh categories (usually seconds — batches are cached 24h).
  - name: classify-emails
    entrypoint: flows/classify_emails.py:classify_emails
    work_pool: *home
    concurrency_limit: *cancel_new
    triggers:
      - type: event
        expect:
          - "prefect.flow-run.Completed"
        match_related:
          prefect.resource.name: "ingest"
          prefect.resource.role: "deployment"

  - name: transform
    entrypoint: flows/transform.py:transform
    work_pool:
      name: home-pool
      job_variables:
        command: >-
          uv run --python 3.13.11
          --with 'my-prefect-server @ git+https://github.com/zzstoatzz/my-prefect-server.git{{ $MPS_PIN }}'
          prefect flow-run execute
        env:
          ANALYTICS_DB_PATH: /home/stoat/prefect-analytics/analytics.duckdb
          LLM_SPEND_LOG_PATH: /home/stoat/prefect-analytics/llm-spend.jsonl
          PREFECT_LOCAL_STORAGE_PATH: /home/stoat/prefect-analytics/storage
    concurrency_limit: *cancel_new
    triggers:
      - type: event
        expect:
          - "prefect.flow-run.Completed"
        match_related:
          prefect.resource.name: "classify-emails"
          prefect.resource.role: "deployment"

  - name: brief
    entrypoint: flows/brief.py:brief
    work_pool: *home
    triggers:
      - type: event
        expect:
          - "prefect.flow-run.Completed"
        match_related:
          prefect.resource.name: "transform"
          prefect.resource.role: "deployment"

  # phi's per-user relationship summaries + likes observations (formerly
  # "compact"). chained off transform because it reads the dbt mart AND to
  # serialize DuckDB access behind the single-writer pipeline.
  - name: phi-memory-synthesis
    entrypoint: flows/compact.py:compact
    work_pool: *home
    triggers:
      - type: event
        expect:
          - "prefect.flow-run.Completed"
        match_related:
          prefect.resource.name: "transform"
          prefect.resource.role: "deployment"

  # phi's tag merge/relationship maintenance (formerly "morning")
  - name: phi-tag-maintenance
    entrypoint: flows/morning.py:morning
    work_pool: *home
    concurrency_limit: *cancel_new
    schedules:
      - cron: "0 13 * * *"  # 8am CT daily

  - name: curate
    entrypoint: flows/curate.py:curate
    work_pool: *home
    triggers:
      - type: event
        expect:
          - "prefect.flow-run.Completed"
        match_related:
          prefect.resource.name: "phi-tag-maintenance"
          prefect.resource.role: "deployment"

  - name: phi-atlas
    entrypoint: flows/phi_atlas.py:phi_atlas
    # 2D map of phi's mental landscape. UMAP+HDBSCAN over every PDS record
    # and TurboPuffer row phi owns. ML deps (numpy/scipy/umap-learn/hdbscan)
    # live in the [atlas] extra so other flows' pods don't pull them.
    work_pool:
      name: home-pool
      job_variables:
        command: >-
          uv run --python 3.13.11
          --with 'my-prefect-server[atlas] @ git+https://github.com/zzstoatzz/my-prefect-server.git{{ $MPS_PIN }}'
          prefect flow-run execute
        env:
          ANALYTICS_DB_PATH: /home/stoat/prefect-analytics/analytics.duckdb
          LLM_SPEND_LOG_PATH: /home/stoat/prefect-analytics/llm-spend.jsonl
          PREFECT_LOCAL_STORAGE_PATH: /home/stoat/prefect-analytics/storage
    concurrency_limit: *cancel_new
    schedules:
      - cron: "0 13 * * *"  # 8am CT daily, alongside morning

  - name: docket
    entrypoint: flows/docket.py:docket
    # Daily promotion object — consumes the atlas, emits 5-15 candidate
    # work items. Event-triggered on phi-atlas completion so the docket
    # exactly tracks the atlas it was derived from. No separate cron.
    work_pool: *home
    triggers:
      - type: event
        expect:
          - "prefect.flow-run.Completed"
        match_related:
          prefect.resource.name: "phi-atlas"
          prefect.resource.role: "deployment"

  # the pub-search leaflet map (formerly "rebuild-atlas" — renamed so it can't
  # be confused with phi-atlas, which is a different atlas entirely)
  - name: leaflet-atlas
    entrypoint: flows/atlas.py:rebuild_atlas
    # Canary for the job-variable-driven secret pattern: secrets are
    # injected as env vars (resolved from Secret blocks at deploy time),
    # so flow code never calls Secret.load() and tasks just inherit env.
    work_pool:
      name: home-pool
      job_variables:
        # pin 3.13: the atlas build (umap/numba/pydantic-core) has no working
        # py3.14 wheels, and atlas.py's `uv run --script` subprocess inherits
        # this interpreter — so the flow must launch under 3.13, not the
        # worker's default 3.14. (numpy<2.2 pin lives in pub-search's
        # build-atlas script; both are required.)
        command: >-
          uv run --python 3.13.11
          --with 'my-prefect-server @ git+https://github.com/zzstoatzz/my-prefect-server.git{{ $MPS_PIN }}'
          prefect flow-run execute
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          VECLIB_MAXIMUM_THREADS: "1"
          NUMBA_NUM_THREADS: "1"
          MALLOC_ARENA_MAX: "2"
          TURBOPUFFER_API_KEY: "{{ prefect.blocks.secret.tpuf-token }}"
          CLOUDFLARE_API_TOKEN: "{{ prefect.blocks.secret.cloudflare-api-token }}"
          ANTHROPIC_API_KEY: "{{ prefect.blocks.secret.anthropic-api-key }}"
          TURSO_URL: "{{ prefect.blocks.secret.turso-url }}"
          TURSO_TOKEN: "{{ prefect.blocks.secret.turso-token }}"
          ANALYTICS_DB_PATH: /home/stoat/prefect-analytics/analytics.duckdb
          LLM_SPEND_LOG_PATH: /home/stoat/prefect-analytics/llm-spend.jsonl
          PREFECT_LOCAL_STORAGE_PATH: /home/stoat/prefect-analytics/storage
    concurrency_limit: *cancel_new
    schedules:
      - cron: "0 */6 * * *"  # every 6 hours

  - name: pds-records
    entrypoint: flows/pds_records.py:pds_records
    work_pool: *home
    parameters:
      config:
        action: list
        collection: network.cosmik.connection
        dry_run: true

  - name: costs
    entrypoint: flows/costs.py:costs
    # provider billing tokens injected from Secret blocks (resolved at deploy
    # time); connectors read os.environ. atproto creds load via Secret.load in
    # the flow, matching pds-records. CLOUDFLARE_API_TOKEN block already exists;
    # create fly-api-token / hcloud-token / neon-api-key blocks before deploying.
    # runs on the home box (heavypad) — decoupled from the hub (writes to PDS,
    # which the hub reads via API), so safe to migrate independently.
    work_pool:
      name: home-pool
      job_variables:
        command: >-
          uv run
          --with 'my-prefect-server @ git+https://github.com/zzstoatzz/my-prefect-server.git{{ $MPS_PIN }}'
          prefect flow-run execute
        env:
          CLOUDFLARE_API_TOKEN: "{{ prefect.blocks.secret.cloudflare-api-token }}"
          # account-scoped CF tokens can't list /accounts; account id isn't
          # secret (it's in dashboard URLs / wrangler.jsonc), so inline it.
          CLOUDFLARE_ACCOUNT_ID: "3e9ba01cd687b3c4d29033908177072e"
          FLY_API_TOKEN: "{{ prefect.blocks.secret.fly-api-token }}"
          NEON_API_KEY: "{{ prefect.blocks.secret.neon-api-key }}"
          # hetzner is NOT here: its tokens are project-scoped (one per cloud
          # project), so the flow loads the `hetzner-tokens` Secret block (a
          # dict of {name: token}) and merges them. Cloud is the whole Hetzner
          # footprint — there are no dedicated/Robot servers on this account.
          # CF billing API is 403 for this token (no Billing:Read scope) and
          # mostly deprecated anyway, so fixed costs are explicit resource
          # lines. Keep these resource-shaped so project attribution works.
          CLOUDFLARE_FIXED_COSTS_JSON: '{"plyr.fm":{"amount":1.00,"project":"plyr.fm","note":"plyr.fm domain registration"},"workers-paid-plan":{"amount":4.00,"project":"shared","note":"Cloudflare Workers Paid plan"}}'
          # NEON_PLAN_USD: "5.00"          # monthly plan base (default 5)
          # FLY_ORG_SLUG: "personal"
    parameters:
      config:
        dry_run: false
    concurrency_limit: *cancel_new
    schedules:
      - cron: "0 8 * * *"  # daily at 08:00 UTC

  - name: typeahead-enrich-backfill
    entrypoint: flows/typeahead_enrich_backfill.py:typeahead_enrich_backfill
    # one-shot/chained backfill for the ~6M actors stuck at profile_checked_at=0
    # (the hourly cron's 200/run cold floor would take ~3.5 years). NO schedule —
    # run manually, dry_run=true + small limit first, then chain paced runs via
    # the returned last_rowid. concurrency 1: never two walkers on the queue.
    concurrency_limit: 1
    work_pool:
      name: home-pool
      job_variables:
        command: >-
          uv run
          --with 'my-prefect-server @ git+https://github.com/zzstoatzz/my-prefect-server.git{{ $MPS_PIN }}'
          prefect flow-run execute
        env:
          TURSO_URL: "{{ prefect.blocks.secret.typeahead-turso-url }}"
          TURSO_AUTH_TOKEN: "{{ prefect.blocks.secret.typeahead-turso-token }}"
  - name: typeahead-index
    entrypoint: flows/typeahead_index.py:typeahead_index
    # the typeahead snapshot builder (Zig MODE=indexer), lifted off Fly onto the
    # home box. Pure batch: reads Turso → builds prefix index on the NVMe →
    # uploads to R2 → exits; App B promotes it. No SLA — a late/failed run just
    # serves the prior snapshot. host prereqs (zig 0.16 + rclone) installed by
    # typeahead deploy/home-indexer/install.sh. concurrency 1 so builds never
    # overlap. 09:00 UTC sits clear of the 6h leaflet-atlas marks + the 13:00 cluster.
    work_pool:
      name: home-pool
      job_variables:
        command: >-
          uv run
          --with 'my-prefect-server @ git+https://github.com/zzstoatzz/my-prefect-server.git{{ $MPS_PIN }}'
          prefect flow-run execute
        env:
          # typeahead-specific turso blocks — the shared `turso-url`/`turso-token`
          # blocks point at the LEAFLET db (they're the atlas flow's). These hold
          # the full libsql:// URL; the flow strips the scheme to the bare host
          # the indexer's TursoClient expects.
          TURSO_URL: "{{ prefect.blocks.secret.typeahead-turso-url }}"
          TURSO_AUTH_TOKEN: "{{ prefect.blocks.secret.typeahead-turso-token }}"
          INDEX_R2_ENDPOINT: "{{ prefect.blocks.secret.index-r2-endpoint }}"
          INDEX_R2_BUCKET: "{{ prefect.blocks.secret.index-r2-bucket }}"
          INDEX_R2_ACCESS_KEY_ID: "{{ prefect.blocks.secret.index-r2-access-key-id }}"
          INDEX_R2_SECRET_ACCESS_KEY: "{{ prefect.blocks.secret.index-r2-secret-access-key }}"
          # persistent NVMe paths — process runs execute in ephemeral /tmp.
          INDEXER_HOME: /home/stoat/typeahead-index
          INDEX_BUILD_ROOT: /home/stoat/typeahead-index/build
          # publish to prod. INDEX_ALLOW_PROD arms the overwrite of latest.json.
          # (local-channel dry-run validated the full path 2026-06-18 — run e3b70e03
          # Completed, built a full 10GB snapshot; now publishing for real.)
          INDEX_CHANNEL: prod
          INDEX_ALLOW_PROD: "1"
          # 0 = full corpus. The binary DEFAULTS to a 1000-actor sample, which
          # the App B floor guard rejects — must be explicit (as the old Fly
          # machine was).
          INDEX_SAMPLE_LIMIT: "0"
          INDEXER_VERSION: heavypad
          # cap the ~8.6GB R2 upload so it never saturates the home uplink (the
          # thing that angers a residential ISP). rclone inherits this env var —
          # no --bwlimit arg needed. tune to ~half the uplink; 10M = ~80 Mbit/s.
          RCLONE_BWLIMIT: "10M"
    concurrency_limit: *cancel_new
    schedules:
      # every 3 days, not daily — ~thirds the monthly bandwidth (~170GB/mo). The
      # snapshot tolerates days of staleness because the live overlay covers
      # recently-ingested actors.
      - cron: "0 9 */3 * *"  # 09:00 UTC, every 3rd day-of-month
        # ACTIVE 2026-06-18: the full path is validated end-to-end — local run
        # e3b70e03 proved build->index, and a staging run published a 10GB snapshot
        # to R2 (staging/heavypad-validation/b1781771245-1b0a + its latest pointer).
        # NOTE: prefect 3.7.2 won't overwrite an existing deployment's schedule, so
        # activating requires delete+recreate of the deployment (not just redeploy).
        active: true

  - name: typeahead-plc-identity
    entrypoint: flows/typeahead_plc_identity.py:typeahead_plc_identity
    # Bulk DID -> (handle, pds) resolution from the PLC log, via fig's Allegedly
    # weekly bundles. typeahead's per-DID identity resolution could not converge
    # (1.3M rows missing handle, 9.3M missing pds, at 500/run). Not on the
    # Cloudflare cron: ~28GB of bundles and a multi-GB working set. Same home-pool
    # shape as typeahead-index — pure batch, no ingress, no SLA.
    work_pool:
      name: home-pool
      job_variables:
        command: >-
          uv run
          --with 'my-prefect-server @ git+https://github.com/zzstoatzz/my-prefect-server.git{{ $MPS_PIN }}'
          prefect flow-run execute
        env:
          # full libsql:// URL — unlike typeahead-index, this flow does NOT strip
          # the scheme; the python script rewrites it to https itself.
          TURSO_URL: "{{ prefect.blocks.secret.typeahead-turso-url }}"
          TURSO_AUTH_TOKEN: "{{ prefect.blocks.secret.typeahead-turso-token }}"
          # persistent NVMe — process runs execute in an ephemeral /tmp, and the
          # bundle cache is ~28GB that we do NOT want to re-download weekly.
          PLC_BUNDLE_DIR: /home/stoat/typeahead-plc
          PLC_APPLY: "1"
    concurrency_limit: *cancel_new
    schedules:
      # weekly, matching the bundle cadence — Allegedly stops ~73h short of now
      # (PLC ops can still be invalidated inside that window) and the relay
      # firehose's #identity events cover the remainder, so there is nothing to
      # gain from running more often. 05:00 UTC Monday sits clear of
      # typeahead-index (09:00) and the 13:00 cluster.
      - cron: "0 5 * * 1"
        # ACTIVE since 2026-07-30, after a clean end-to-end run: 319,888
        # identity updates applied, handle backlog 1,311,817 -> 14,680.
        #
        # This file IS authoritative for the schedule. Verified 2026-07-30 on
        # prefect 3.7.3 by changing the cron and by flipping this flag: each
        # `prefect deploy` REPLACES the schedule (its id changes) and both the
        # cron expression and `active` are applied. The older note claiming
        # deploy won't overwrite an existing schedule, and that activating needs
        # delete+recreate, was wrong on both counts.
        active: true

  - name: pub-search-snapshot
    entrypoint: flows/pub_search_snapshot.py:pub_search_snapshot
    # the pub-search replica snapshot builder (BUILDER_MODE=1), lifted off Fly
    # onto the home box — the same move typeahead-index made. Pure batch: reads
    # the leaf Turso db → gated FTS replica build (~600MB) → rclone to R2
    # (leaflet-search-index) → channel pointer LAST → exits. The serving
    # backend's promote watcher adopts on its own poll; a late/failed run just
    # leaves the prior snapshot serving. See pub-search
    # docs/builder-offbox-plan.md for the cutover sequence.
    work_pool:
      name: home-pool
      job_variables:
        command: >-
          uv run
          --with 'my-prefect-server @ git+https://github.com/zzstoatzz/my-prefect-server.git{{ $MPS_PIN }}'
          prefect flow-run execute
        env:
          # shared turso blocks ARE the leaf db (atlas uses the same ones);
          # pub-search's client wants the full libsql:// URL — no stripping.
          TURSO_URL: "{{ prefect.blocks.secret.turso-url }}"
          TURSO_TOKEN: "{{ prefect.blocks.secret.turso-token }}"
          # pub-search's own R2 bucket (leaflet-search-index) — NOT typeahead's.
          INDEX_R2_ENDPOINT: "{{ prefect.blocks.secret.leaflet-index-r2-endpoint }}"
          INDEX_R2_BUCKET: "{{ prefect.blocks.secret.leaflet-index-r2-bucket }}"
          INDEX_R2_ACCESS_KEY_ID: "{{ prefect.blocks.secret.leaflet-index-r2-access-key-id }}"
          INDEX_R2_SECRET_ACCESS_KEY: "{{ prefect.blocks.secret.leaflet-index-r2-secret-access-key }}"
          # persistent repo/scratch root (process runs execute in ephemeral /tmp;
          # the ~600MB build itself is fine in the run's tmp via BUILD_DIR default)
          BUILDER_HOME: /home/stoat/pub-search-snapshot
          # staging soak passed 2026-07-25 (run 7f12358a: b1784951763-0bbc,
          # 55018 docs, manifest parity with the fly-built prod snapshot).
          BUILDER_CHANNEL: prod
          BUILDER_ALLOW_PROD: "1"
          # cap the ~600MB upload; tiny next to typeahead's 8.6GB but be polite
          RCLONE_BWLIMIT: "10M"
    concurrency_limit: *cancel_new
    schedules:
      # every 2h at :40 — clear of the 6h atlas marks, 09:00 typeahead-index,
      # and the 13:00 cluster. ~7GB/day upload. relax to daily once the
      # pub-search live overlay lands (phase 2 of builder-offbox-plan.md).
      - cron: "40 */2 * * *"
        active: true

  - name: bisk-snapshot
    entrypoint: flows/bisk.py:bisk_snapshot
    # the bisk.social standings builder (https://tangled.org/zzstoatzz.io/bisk).
    # pure batch: reconstructs the pool + the trailing-24h like standings off the
    # open network → publishes a small bisk.json to R2 → exits; the static site
    # adopts it (same builder→snapshot shape as typeahead-index, but tiny). uses a
    # dedicated R2 token scoped to the `bisk` bucket only (bisk-r2-* blocks). boto3
    # pulled in for the R2 put. no SLA — a late run just serves the prior snapshot.
    work_pool:
      name: home-pool
      job_variables:
        command: >-
          uv run
          --with 'my-prefect-server @ git+https://github.com/zzstoatzz/my-prefect-server.git{{ $MPS_PIN }}'
          --with boto3
          prefect flow-run execute
        env:
          # project-scoped: a token minted for the `bisk` bucket only (object rw),
          # not shared with typeahead's index-r2-* creds.
          BISK_R2_ENDPOINT: "{{ prefect.blocks.secret.bisk-r2-endpoint }}"
          BISK_R2_ACCESS_KEY_ID: "{{ prefect.blocks.secret.bisk-r2-access-key-id }}"
          BISK_R2_SECRET_ACCESS_KEY: "{{ prefect.blocks.secret.bisk-r2-secret-access-key }}"
          BISK_R2_BUCKET: bisk
    concurrency_limit: *cancel_new
    schedules:
      # every 10 min — the live overlay (spacedust) covers the gaps between
      # snapshots, so the baseline only needs to be roughly fresh.
      - cron: "*/10 * * * *"
        active: true

  - name: phi-curation
    entrypoint: flows/phi_trigger.py:phi_trigger
    # kicks phi's weekly publication-curation pass via her control API —
    # the bot defines the pass, this deployment owns the clock. more phi
    # schedules = more deployments of phi-trigger with a different slot.
    work_pool:
      name: home-pool
      job_variables:
        command: >-
          uv run
          --with 'my-prefect-server @ git+https://github.com/zzstoatzz/my-prefect-server.git{{ $MPS_PIN }}'
          prefect flow-run execute
    parameters:
      slot: curation
    schedules:
      # sunday 10pm central = 03:00 UTC monday. explicit UTC because the
      # server computed run times in UTC despite a stored timezone field
      # (queued runs came out at 22:00Z) — revisit if that gets fixed.
      # note: drifts to 9pm central when CST returns.
      - cron: "0 3 * * 1"
        active: true

  - name: phi-editorial
    entrypoint: flows/phi_trigger.py:phi_trigger
    # daily coral editorial-context refresh — phi researches coral's
    # trending entities and rewrites io.zzstoatzz.phi.editorialContext,
    # which coral's curator prompt reads each cycle.
    work_pool:
      name: home-pool
      job_variables:
        command: >-
          uv run
          --with 'my-prefect-server @ git+https://github.com/zzstoatzz/my-prefect-server.git{{ $MPS_PIN }}'
          prefect flow-run execute
    parameters:
      slot: editorial
    schedules:
      # daily 15:00 UTC (10am CT) — after the morning flows, when the
      # overnight firehose has settled into a legible trending picture
      - cron: "0 15 * * *"
        active: true

  - name: phi-character-retro
    entrypoint: flows/phi_trigger.py:phi_trigger
    # roughly monthly: phi rereads her own blog/posts/library and
    # rewrites her [SELF] record — claims with receipts, drift visible
    # in the firehose. the personality file is a constitution now.
    work_pool:
      name: home-pool
      job_variables:
        command: >-
          uv run
          --with 'my-prefect-server @ git+https://github.com/zzstoatzz/my-prefect-server.git{{ $MPS_PIN }}'
          prefect flow-run execute
    parameters:
      slot: character-retro
    schedules:
      # first of the month, 17:00 UTC (noon CT)
      - cron: "0 17 1 * *"
        active: true

  - name: phi-chicken-scout
    entrypoint: flows/phi_trigger.py:phi_trigger
    # mid-round market scout — the cheap-entry window, ~12h into the round
    work_pool:
      name: home-pool
      job_variables:
        command: >-
          uv run
          --with 'my-prefect-server @ git+https://github.com/zzstoatzz/my-prefect-server.git{{ $MPS_PIN }}'
          prefect flow-run execute
    parameters:
      slot: chicken-scout
    schedules:
      - cron: "0 18 * * *"
        active: true

  - name: phi-chicken-precheck
    entrypoint: flows/phi_trigger.py:phi_trigger
    # pre-lock check — final books, rivals asleep, last call (was a
    # poller slot in the bot; migrated here 2026-07-16)
    work_pool:
      name: home-pool
      job_variables:
        command: >-
          uv run
          --with 'my-prefect-server @ git+https://github.com/zzstoatzz/my-prefect-server.git{{ $MPS_PIN }}'
          prefect flow-run execute
    parameters:
      slot: chicken-precheck
    schedules:
      - cron: "0 4 * * *"
        active: true

  - name: watch-fastmcp
    entrypoint: flows/watch_fastmcp.py:watch_fastmcp
    # emits github.<reason> events; notifies nobody. Conditional requests that
    # 304 don't count against GitHub's rate limit and it returns
    # X-Poll-Interval: 60, so every 5 minutes is well inside its floor.
    work_pool: *home
    schedules:
      - cron: "*/5 * * * *"
        active: true

  - name: fastmcp-brief
    entrypoint: flows/fastmcp_brief.py:fastmcp_brief
    # Driven by the `fastmcp activity -> brief` and `fastmcp direct ask ->
    # brief` automations in deploy/automations.yaml, PLUS a floor schedule.
    #
    # The automations alone were not enough. `fastmcp activity -> brief` fires
    # at 8 github.* events in an hour, a threshold calibrated on the watcher's
    # cold start, which drained the whole unread backlog as 50 events at once.
    # Steady state is 1-5 an hour: only 2 of 7 active hours cleared 8, and
    # exactly one brief reached discord in the first twelve hours. `fastmcp
    # direct ask -> brief` never fired at all because 49 of 50 events are
    # `subscribed` — review_requested and mention do not occur on this repo.
    #
    # So volume is the wrong trigger on its own: it alarms on bursts of noise
    # and stays silent through a quiet morning that still contains the one PR
    # worth seeing. The floor guarantees the window gets looked at. It is cheap
    # and quiet by construction — the flow drops threads it has already briefed
    # and emits nothing at all when nothing merits surfacing, so a dead window
    # costs one small LLM call and produces no message.
    #
    # This is deliberately the only change to the triggering, so that whether
    # the briefs are any good is attributable. Revert by deleting `schedules`.
    work_pool:
      name: home-pool
      job_variables:
        command: >-
          uv run
          --with 'my-prefect-server @ git+https://github.com/zzstoatzz/my-prefect-server.git{{ $MPS_PIN }}'
          prefect flow-run execute
        env:
          ANALYTICS_DB_PATH: /home/stoat/prefect-analytics/analytics.duckdb
          LLM_SPEND_LOG_PATH: /home/stoat/prefect-analytics/llm-spend.jsonl
          PREFECT_LOCAL_STORAGE_PATH: /home/stoat/prefect-analytics/storage
    parameters:
      window_hours: 6
    schedules:
      - cron: "0 */4 * * *"
        active: true

  - name: pi-agent
    entrypoint: flows/pi_agent.py:pi_agent
    # runs pi (the coding agent) non-interactively on the home box. no
    # schedule — triggered ad hoc for now; the end state is alert-driven
    # (logfire alert -> automation -> this deployment with the alert in the
    # prompt). requires pi installed on the worker box (npm install -g
    # @earendil-works/pi-coding-agent); auth comes from the injected key.
    work_pool:
      name: home-pool
      job_variables:
        command: >-
          uv run
          --with 'my-prefect-server @ git+https://github.com/zzstoatzz/my-prefect-server.git{{ $MPS_PIN }}'
          prefect flow-run execute
        env:
          ANALYTICS_DB_PATH: /home/stoat/prefect-analytics/analytics.duckdb
          LLM_SPEND_LOG_PATH: /home/stoat/prefect-analytics/llm-spend.jsonl
          PREFECT_LOCAL_STORAGE_PATH: /home/stoat/prefect-analytics/storage
          ANTHROPIC_API_KEY: "{{ prefect.blocks.secret.anthropic-api-key }}"

  - name: pi-pr
    entrypoint: flows/pi_pr.py:pi_pr
    # one-off: pi (luna) proposes a change in a throwaway clone, the flow turns
    # it into a tangled pull record and DMs the link. pi holds no credential —
    # the flow publishes, so a hijacked prompt can only produce a bad diff.
    # requires pi installed + openai-codex creds on the worker.
    work_pool: *home
