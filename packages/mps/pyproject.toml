[project]
name = "mps"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "prefect>=3.0",
    "httpx>=0.27",
    "duckdb>=1.0",
    "pydantic>=2",
    "pydantic-ai-slim[anthropic,prefect]",
    # anthropic 1.0.0 (2026-08-20) accepts only httpx2 clients; pydantic-ai's
    # anthropic provider (through 2.32.1) still hands it an httpx.AsyncClient,
    # and its own pin is an unbounded anthropic>=0.108. phi-memory-synthesis
    # broke ten minutes after the release. lift once pydantic-ai's provider
    # moves to httpx2.
    "anthropic<1",
    "turbopuffer",
    "openai",
    "pdsx",
    "genai-prices>=0.0.62",
    "logfire>=4.36.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
