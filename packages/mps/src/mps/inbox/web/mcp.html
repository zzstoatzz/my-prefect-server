<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inbox Zero</title><style>body{font:15px system-ui;color:light-dark(#18314b,#dae6f3);background:light-dark(#edf3f9,#1e3043);color-scheme:light dark;padding:20px}button{font:inherit;padding:10px;margin:4px;border:1px solid #9bb3ca;border-radius:7px}article{padding:15px 0;border-top:1px solid #9bb3ca}p{line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}small{opacity:.75}</style></head><body><h1>Inbox Zero</h1><p id="status">Loading your review queue…</p><div id="items"></div><script type="module">
import {App} from 'https://esm.sh/@modelcontextprotocol/ext-apps@1.2.2';
const app=new App({name:'Inbox Zero',version:'1.0.0'});
const status=document.querySelector('#status');
function render(data){if(!data?.items)return;status.textContent=`${data.remaining} messages left to review`;const root=document.querySelector('#items');root.replaceChildren();for(const item of data.items.slice(0,10)){const row=document.createElement('article');const h=document.createElement('h2');h.textContent=item.subject;const from=document.createElement('small');from.textContent=`${item.provider} · ${item.sender}`;const body=document.createElement('p');body.textContent=item.body.slice(0,1500);row.append(h,from,body);for(const [action,label] of [['read','Mark read'],['keep','Keep actionable'],['defer','Later tomorrow']]){const b=document.createElement('button');b.textContent=label;b.onclick=async()=>{b.disabled=true;try{const result=await app.callServerTool({name:'decide_email',arguments:{decision:{ids:[item.id],action,request_id:crypto.randomUUID(),until:action==='defer'?Date.now()/1000+86400:null}}});if(result.isError)throw Error('Action failed');const queue=await app.callServerTool({name:'review_inbox',arguments:{limit:10}});render(queue.structuredContent);}catch(e){status.textContent='Change not confirmed. Refresh and check the mailbox.';b.disabled=false;}};row.append(b);}root.append(row);}}
app.ontoolresult=result=>render(result.structuredContent);
await app.connect();
</script></body></html>
