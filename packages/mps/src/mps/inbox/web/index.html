<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark"><title>Inbox Zero</title><link rel="stylesheet" href="/assets/style.css"><script type="module" src="/assets/app.js"></script></head>
<body><header><a class="brand" href="/">Inbox Zero</a><span id="progress">Loading your queue…</span><button id="refresh">Refresh mail</button><form method="post" action="/logout"><button class="quiet">Sign out</button></form></header><main><nav aria-label="Review queues"><button data-view="unreviewed" aria-current="page">To review</button><button data-view="actionable">Actionable</button><button data-view="deferred">Later</button><button data-view="reviewed">Reviewed</button></nav><div id="sources" class="sources"></div><p id="status" role="status"></p><button id="browse" aria-expanded="false">Browse messages</button><section class="workspace"><aside><div class="list-head"><h1>Your next decisions</h1><span id="count"></span></div><label class="filter">Find in this batch<input id="filter" type="search" placeholder="Sender or subject"></label><div id="list"></div><div class="paging"><button id="previous">Previous batch</button><button id="next">Next batch</button></div></aside><article id="detail"><p>Choose a message to begin.</p></article></section></main><footer>Every decision is saved. Stop whenever you’re ready.</footer><dialog id="confirm"><form method="dialog"><h2 id="confirm-title"></h2><p id="confirm-text"></p><button value="cancel" class="quiet">Cancel</button><button value="confirm">Confirm</button></form></dialog></body></html>
