[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prefect-exe"
version = "0.1.0"
description = "Run Prefect deployments on exe.dev VMs"
requires-python = ">=3.11"
dependencies = ["prefect>=3.7.7,<4"]

[project.entry-points."prefect.collections"]
prefect_exe = "prefect_exe"

[tool.hatch.build.targets.wheel]
packages = ["src/prefect_exe"]
